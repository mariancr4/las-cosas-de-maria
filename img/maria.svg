<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Niña original: pelo moreno oscuro con dos coletas y piel muy clarita -->
  <defs><linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8dcff"/><stop offset="1" stop-color="#c9a8ff"/></linearGradient></defs>
  <rect width="200" height="200" fill="url(#fondo)"/>
  <!-- dos coletas -->
  <path d="M46 70 C22 66 8 92 14 122 C18 142 30 154 26 168 C44 160 52 138 50 116 C49 100 54 84 46 70 Z" fill="#2a1b14"/>
  <path d="M154 70 C178 66 192 92 186 122 C182 142 170 154 174 168 C156 160 148 138 150 116 C151 100 146 84 154 70 Z" fill="#2a1b14"/>
  <!-- gomas de las coletas -->
  <circle cx="44" cy="76" r="8" fill="#ff5f9e"/><circle cx="41" cy="73" r="2.5" fill="#fff" opacity=".7"/>
  <circle cx="156" cy="76" r="8" fill="#ff5f9e"/><circle cx="153" cy="73" r="2.5" fill="#fff" opacity=".7"/>
  <!-- pelo de arriba -->
  <path d="M48 100 C44 54 72 30 100 30 C128 30 156 54 152 100 Z" fill="#2a1b14"/>
