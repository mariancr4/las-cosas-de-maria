  <path d="M46 200 C50 170 72 156 100 156 C128 156 150 170 154 200 Z" fill="#ff8fb1" stroke="#4a3b5c" stroke-width="3.5"/>
  <path d="M84 158 Q100 172 116 158" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- cara -->
  <ellipse cx="100" cy="102" rx="50" ry="54" fill="#fdeee6" stroke="#4a3b5c" stroke-width="3.5"/>
  <!-- orejas -->
  <ellipse cx="51" cy="106" rx="8" ry="11" fill="#fbe3d6" stroke="#4a3b5c" stroke-width="3.5"/>
  <ellipse cx="149" cy="106" rx="8" ry="11" fill="#fbe3d6" stroke="#4a3b5c" stroke-width="3.5"/>
  <!-- flequillo -->
  <path d="M50 96 C48 58 72 40 100 40 C128 40 152 58 150 96 C140 84 132 70 126 60 C118 76 100 82 86 80 C78 88 64 94 50 96 Z" fill="#2a1b14"/>
  <!-- ojos -->
  <ellipse cx="80" cy="106" rx="7" ry="9" fill="#2a1b14"/>
  <ellipse cx="120" cy="106" rx="7" ry="9" fill="#2a1b14"/>
  <circle cx="82" cy="103" r="2.5" fill="#fff"/>
  <circle cx="122" cy="103" r="2.5" fill="#fff"/>
  <!-- cejas -->
  <path d="M70 92 Q80 86 90 91 M110 91 Q120 86 130 92" fill="none" stroke="#2a1b14" stroke-width="3" stroke-linecap="round"/>
