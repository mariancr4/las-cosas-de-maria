  <path d="M98 116 Q100 120 102 116" fill="none" stroke="#e9b9a6" stroke-width="3" stroke-linecap="round"/>
  <path d="M86 130 Q100 144 114 130" fill="#e8576f" stroke="#c43d57" stroke-width="2" stroke-linejoin="round"/>
